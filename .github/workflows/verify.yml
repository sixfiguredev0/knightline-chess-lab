name: Verify Knightline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/publication-check.cjs
      - run: npm run package
